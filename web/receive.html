<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' blob:; media-src blob: mediastream:">
<title>Beamlet — 受信</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070d">
<link rel="stylesheet" href="style.css">
<script type="module" src="pwa.js"></script>
<header class="topbar"><a class="brand" href="index.html">← <img class="mark" src="apple-touch-icon.png" alt="" width="18" height="18">BEAMLET</a></header>
<main>
  <h1>受信</h1>
  <section id="step-key">
    <p>送信側のカメラにこの QR コードを見せてください。</p>
    <div class="plate"><canvas id="qr"></canvas></div>
    <p class="fingerprint">確認番号 <strong id="fingerprint"></strong></p>
    <p>送信側に同じ番号が出ていることを確かめてから、送信側の画面にカメラを向けます。</p>
    <button id="start">カメラで受信を始める</button>
    <p id="key-status" class="status error" aria-live="polite"></p>
  </section>
  <section id="step-receive" hidden data-state="searching">
    <div class="phase">
      <p id="phase-label" class="phase-label">送信側の画面を探しています</p>
      <div id="meter" class="meter" role="progressbar" aria-labelledby="phase-label" aria-valuemin="0" aria-valuemax="100"><span></span></div>
      <p id="phase-hint" class="phase-hint"></p>
    </div>
    <div class="viewfinder"><video id="video" playsinline muted></video></div>
    <p class="fingerprint">確認番号 <strong id="fingerprint-rx"></strong></p>
    <p id="status" class="status">送信側の画面を探しています…</p>
    <ul id="files"></ul>
    <button id="stop">受信をやめる</button>
    <a id="again" class="button" href="receive.html" hidden>新しく受信する</a>
  </section>
</main>
<script type="module" src="receive.js"></script>
</html>
