[package]
name = "beamlet-stream"
version = "0.1.0"
edition = "2021"
publish = false
description = "BOS1 optical stream format: layout, rendering and camera-side decoding (docs/STREAM_FORMAT.md)"

[dependencies]
raptorq = { version = "2", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["zeroize", "static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }
miniz_oxide = "0.8"
zeroize = "1"
