[package]
name = "beamlet-stream-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "WebAssembly exports of beamlet-stream for the browser"

[lib]
crate-type = ["cdylib"]

[dependencies]
beamlet-stream = { path = ".." }
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.9", default-features = false }
